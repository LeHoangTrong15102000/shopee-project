services:
  mongodb:
    image: mongo:7
    container_name: shopee-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: shopee_root_password
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - ./docker/docker_data/mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - shopee-nw
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  shopee-nw:
    driver: bridge
