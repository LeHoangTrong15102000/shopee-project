services:
  mongodb:
    image: mongo:7
    container_name: shopee-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: shopee_root_password
    volumes:
      - ./docker/docker_data/mongodb_data:/data/db
    networks:
      - shopee-nw

networks:
  shopee-nw:
    driver: bridge
