name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== COMPUTE AFFECTED ====================
  compute-affected:
    name: Compute Affected Apps
    runs-on: ubuntu-latest
    outputs:
      api-affected: ${{ steps.set-affected.outputs.api-affected }}
      web-affected: ${{ steps.set-affected.outputs.web-affected }}
      admin-affected: ${{ steps.set-affected.outputs.admin-affected }}
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          fetch-depth: '0'

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Determine affected apps
        id: set-affected
        shell: bash
        run: |
          AFFECTED=$(pnpm nx show projects --affected --type=app 2>/dev/null || echo "")
          echo "Affected projects: $AFFECTED"

          if echo "$AFFECTED" | grep -q "shopee-api"; then
            echo "api-affected=true" >> $GITHUB_OUTPUT
          else
            echo "api-affected=false" >> $GITHUB_OUTPUT
          fi

          if echo "$AFFECTED" | grep -q "shopee-web"; then
            echo "web-affected=true" >> $GITHUB_OUTPUT
          else
            echo "web-affected=false" >> $GITHUB_OUTPUT
          fi

          if echo "$AFFECTED" | grep -q "shopee-admin"; then
            echo "admin-affected=true" >> $GITHUB_OUTPUT
          else
            echo "admin-affected=false" >> $GITHUB_OUTPUT
          fi

  # ==================== LINT ====================
  lint-api:
    name: Lint (shopee-api)
    runs-on: ubuntu-latest
    needs: compute-affected
    if: needs.compute-affected.outputs.api-affected == 'true'
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint shopee-api
        run: pnpm nx lint shopee-api

  lint-web:
    name: Lint (shopee-web)
    runs-on: ubuntu-latest
    needs: compute-affected
    if: needs.compute-affected.outputs.web-affected == 'true'
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint shopee-web
        run: pnpm nx lint shopee-web

  lint-admin:
    name: Lint (shopee-admin)
    runs-on: ubuntu-latest
    needs: compute-affected
    if: needs.compute-affected.outputs.admin-affected == 'true'
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint shopee-admin
        run: pnpm nx lint shopee-admin

  # ==================== TEST ====================
  test-api:
    name: Test (shopee-api)
    runs-on: ubuntu-latest
    needs: compute-affected
    if: needs.compute-affected.outputs.api-affected == 'true'
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('apps/shopee-api/package.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Test shopee-api
        run: pnpm nx test shopee-api

  test-web:
    name: Test (shopee-web)
    runs-on: ubuntu-latest
    needs: compute-affected
    if: needs.compute-affected.outputs.web-affected == 'true'
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Test shopee-web
        run: pnpm nx test shopee-web

  test-admin:
    name: Test (shopee-admin)
    runs-on: ubuntu-latest
    needs: compute-affected
    if: needs.compute-affected.outputs.admin-affected == 'true'
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Test shopee-admin
        run: pnpm nx test shopee-admin

  # ==================== BUILD VERIFY ====================
  build-verify-api:
    name: Build Verify (shopee-api)
    runs-on: ubuntu-latest
    needs: [compute-affected, lint-api]
    if: needs.compute-affected.outputs.api-affected == 'true'
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build shopee-api
        run: pnpm nx build shopee-api

  build-verify-web:
    name: Build Verify (shopee-web)
    runs-on: ubuntu-latest
    needs: [compute-affected, lint-web]
    if: needs.compute-affected.outputs.web-affected == 'true'
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build shopee-web
        run: pnpm nx build shopee-web

  build-verify-admin:
    name: Build Verify (shopee-admin)
    runs-on: ubuntu-latest
    needs: [compute-affected, lint-admin]
    if: needs.compute-affected.outputs.admin-affected == 'true'
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build shopee-admin
        run: pnpm nx build shopee-admin

  # ==================== CI GATE ====================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - compute-affected
      - lint-api
      - lint-web
      - lint-admin
      - test-api
      - test-web
      - test-admin
      - build-verify-api
      - build-verify-web
      - build-verify-admin
    steps:
      - name: Check all jobs passed or were skipped
        shell: bash
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -E '"failure"|"cancelled"'; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed or were skipped. CI gate passed."
