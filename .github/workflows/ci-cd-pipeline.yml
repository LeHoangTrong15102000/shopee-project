# =============================================================================
# ci-cd-pipeline.yml — Single consolidated CI/CD pipeline
#
# Push goes straight to master (personal project). This ONE file runs five
# jobs. Three are chained via `needs:` so ordering is guaranteed:
#
#   1. quality          — lint + format check (the gate)
#   2. build-and-push   — build & push 3 Docker images to Docker Hub
#   3. deploy           — SSH to VPS, rolling update via deploy.sh
#
# One job runs fully independently (no `needs:`, no job depends on it):
#
#   test                — run the Nx test suite in parallel with the chain;
#                         failures mark the run red but never block build/deploy
#
# One job runs after the chain with `if: always()` so it fires regardless of
# whether upstream jobs succeed, fail, or are cancelled:
#
#   notify              — post deploy outcome to Telegram via appleboy/telegram-action;
#                         skipped gracefully when TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
#                         secrets are absent, so forks/contributors are never blocked
#
# deploy.sh on the VPS runs health-check.sh and auto-rolls-back on failure,
# so there is no separate post-deploy health job here.
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==================== QUALITY GATE (lint + format) ====================
  quality:
    name: Quality (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint all projects
        run: pnpm nx run-many -t lint --exclude=@shopee/source

      - name: Format check
        run: pnpm nx format:check --all

  # ==================== TEST (independent — runs in parallel) ====================
  test:
    name: Test (all projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run tests
        run: pnpm nx run-many -t test

  # ==================== BUILD & PUSH (Docker Hub) ====================
  build-and-push:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: shopee-api
            dockerfile: apps/shopee-api/Dockerfile
            build-args: ''
          - app: shopee-web
            dockerfile: apps/shopee-web/Dockerfile
            build-args: |
              VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL_PROD }}
              VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL_PROD }}
              VITE_SITE_URL=${{ vars.VITE_SITE_URL_PROD }}
              VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.VITE_STRIPE_PUBLISHABLE_KEY_PROD }}
              VITE_ENABLE_MOCKS=${{ vars.VITE_ENABLE_MOCKS_PROD }}
          - app: shopee-admin
            dockerfile: apps/shopee-admin/Dockerfile
            build-args: |
              VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL_PROD }}
              VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL_PROD }}
              VITE_APP_VERSION=${{ vars.VITE_APP_VERSION_PROD }}
              VITE_ENABLE_MOCKS=${{ vars.VITE_ENABLE_MOCKS_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        shell: bash
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}:sha-${{ steps.sha.outputs.short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}:latest
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ==================== DEPLOY TO VPS ====================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      # Sync scripts/ from the built commit to the VPS before deploying so the
      # VPS always runs the exact scripts that shipped with this commit. Without
      # this step, script changes never reach the VPS until a manual git pull.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync deploy scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: 'scripts/*.sh'
          target: 'shopee-project/scripts'
          overwrite: true
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: DOCKERHUB_TOKEN,DOCKERHUB_USERNAME
          # Sized above real worst-case single-pass deploy: health-check.sh runs
          # 30×5s per service × 3 services = ~450s (~8m). With rollback death-loop
          # removed, 15m gives comfortable margin without hanging on the default.
          command_timeout: 15m
          script: |
            REGISTRY="${DOCKERHUB_USERNAME}"
            IMAGE_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            cd "$HOME/shopee-project" || exit 1
            chmod +x scripts/*.sh
            ./scripts/deploy.sh "$REGISTRY" "$IMAGE_TAG" "shopee-api shopee-web shopee-admin"

  # ==================== NOTIFY (Telegram) ====================
  notify:
    name: Notify (Telegram)
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Compute overall result
        id: result
        shell: bash
        run: |
          deploy="${{ needs.deploy.result }}"
          build="${{ needs.build-and-push.result }}"
          quality="${{ needs.quality.result }}"

          # Use deploy result; fall back to build-and-push, then quality when
          # deploy was skipped because an earlier job failed.
          if [ "$deploy" = "success" ]; then
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "label=SUCCESS" >> "$GITHUB_OUTPUT"
          elif [ "$deploy" = "failure" ] || [ "$build" = "failure" ] || [ "$quality" = "failure" ]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "label=FAILURE" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=⚠️" >> "$GITHUB_OUTPUT"
            echo "label=CANCELLED" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute short SHA and escape commit subject
        id: meta
        shell: bash
        run: |
          short_sha="$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

          # HTML-escape the commit subject so Telegram HTML parse mode never errors
          subject="${{ github.event.head_commit.message }}"
          subject="${subject%%$'\n'*}"   # first line only
          subject="${subject//&/&amp;}"
          subject="${subject//</&lt;}"
          subject="${subject//>/&gt;}"
          echo "subject=${subject}" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ env.TELEGRAM_CHAT_ID }}
          token: ${{ env.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ${{ steps.result.outputs.emoji }} <b>${{ steps.result.outputs.label }}</b> — ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ steps.meta.outputs.short_sha }} — ${{ steps.meta.outputs.subject }}
            Author: ${{ github.actor }}
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run #${{ github.run_number }}</a>
