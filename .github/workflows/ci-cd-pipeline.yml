name: Shopee Web CI/CD Pipeline

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.12.1'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  push:
    branches: [master, develop]
    paths:
      - 'apps/shopee-web/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig.base.json'
  pull_request:
    branches: [master, develop]
    paths:
      - 'apps/shopee-web/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig.base.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== CHANGE DETECTION ====================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      shopee-web: ${{ steps.filter.outputs.shopee-web }}
      libs: ${{ steps.filter.outputs.libs }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shopee-web:
              - 'apps/shopee-web/src/**'
              - 'apps/shopee-web/public/**'
              - 'apps/shopee-web/package.json'
              - 'apps/shopee-web/vite.config.ts'
              - 'apps/shopee-web/tsconfig.json'
              - 'apps/shopee-web/tsconfig.node.json'
              - 'apps/shopee-web/tailwind.config.cjs'
              - 'apps/shopee-web/index.html'
            libs:
              - 'libs/**'
            tests:
              - 'apps/shopee-web/test/**'
              - 'apps/shopee-web/vitest.setup.js'
              - 'apps/shopee-web/src/**/*.test.{ts,tsx}'

  # ==================== LINT ====================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shopee-web == 'true' || needs.changes.outputs.libs == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeScript Type Check
        run: pnpm nx run shopee-web:build --skip-nx-cache
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: ESLint
        run: pnpm nx run shopee-web:lint

  # ==================== TEST ====================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.shopee-web == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm nx run shopee-web:test -- --coverage
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Check Coverage Threshold
        run: |
          COVERAGE_FILE="apps/shopee-web/coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE=$(node -e "
              const report = require('./$COVERAGE_FILE');
              const total = report.total;
              const avg = (total.lines.pct + total.statements.pct + total.functions.pct + total.branches.pct) / 4;
              console.log(avg.toFixed(2));
            " 2>/dev/null || echo "0")
            echo "Coverage: ${COVERAGE}%"
            if (( $(echo "$COVERAGE < 75" | bc -l 2>/dev/null || echo "0") )); then
              echo "::warning::Coverage ${COVERAGE}% is below 75% threshold"
            fi
          else
            echo "::warning::Coverage report not found"
          fi

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          files: apps/shopee-web/coverage/lcov.info
          flags: shopee-web
          name: shopee-web-coverage
          fail_ci_if_error: false

  # ==================== BUILD ====================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shopee-web
        run: |
          cd apps/shopee-web
          pnpm run build:production
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shopee-web-build
          path: apps/shopee-web/dist/
          retention-days: 3

  # ==================== DEPLOY PRODUCTION ====================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/shopee-web

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: shopee-web-build
          path: apps/shopee-web/dist

      - name: Create Vercel Output Structure
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/" }
            ]
          }
          EOF
        working-directory: apps/shopee-web

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/shopee-web
