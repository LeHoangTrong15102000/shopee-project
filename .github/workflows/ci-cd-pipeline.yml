name: Shopee CI/CD Pipeline

env:
  NODE_VERSION: '22'

on:
  push:
    branches: [master, develop]
    paths:
      - 'apps/shopee-web/**'
      - 'apps/shopee-admin/**'
      - 'apps/shopee-api/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/**'
  pull_request:
    branches: [master, develop]
    paths:
      - 'apps/shopee-web/**'
      - 'apps/shopee-admin/**'
      - 'apps/shopee-api/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== CHANGE DETECTION ====================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web-src: ${{ steps.filter.outputs.web-src }}
      web-tests: ${{ steps.filter.outputs.web-tests }}
      admin-src: ${{ steps.filter.outputs.admin-src }}
      admin-tests: ${{ steps.filter.outputs.admin-tests }}
      api-src: ${{ steps.filter.outputs.api-src }}
      api-tests: ${{ steps.filter.outputs.api-tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web-src:
              - 'apps/shopee-web/src/**'
              - 'apps/shopee-web/public/**'
              - 'apps/shopee-web/package.json'
              - 'apps/shopee-web/vite.config.ts'
              - 'apps/shopee-web/tsconfig.json'
              - 'apps/shopee-web/index.html'
              - 'libs/**'
              - '.github/workflows/**'
              - 'nx.json'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
            web-tests:
              - 'apps/shopee-web/src/**/*.test.{ts,tsx}'
              - 'apps/shopee-web/test/**'
              - 'apps/shopee-web/vitest.setup.js'
            admin-src:
              - 'apps/shopee-admin/src/**'
              - 'apps/shopee-admin/public/**'
              - 'apps/shopee-admin/package.json'
              - 'apps/shopee-admin/vite.config.ts'
              - 'apps/shopee-admin/tsconfig.json'
              - 'apps/shopee-admin/index.html'
              - 'libs/**'
              - '.github/workflows/**'
              - 'nx.json'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
            admin-tests:
              - 'apps/shopee-admin/src/**/*.test.{ts,tsx}'
              - 'apps/shopee-admin/test/**'
              - 'apps/shopee-admin/vitest.setup.ts'
            api-src:
              - 'apps/shopee-api/src/**'
              - 'apps/shopee-api/package.json'
              - 'apps/shopee-api/tsconfig.json'
              - 'apps/shopee-api/jest.config.js'
              - '.github/workflows/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            api-tests:
              - 'apps/shopee-api/src/**/*.test.ts'
              - 'apps/shopee-api/src/**/*.spec.ts'
              - 'apps/shopee-api/src/__tests__/**'

  # ==================== SHOPEE-WEB: LINT ====================
  lint-web:
    name: Lint (shopee-web)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web-src == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeScript Type Check
        run: cd apps/shopee-web && npx tsc --noEmit
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: ESLint
        run: pnpm nx run shopee-web:lint

  # ==================== SHOPEE-WEB: TEST ====================
  test-web:
    name: Test (shopee-web)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web-src == 'true' || needs.changes.outputs.web-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm nx run shopee-web:test -- --run --shard=${{ matrix.shard }}
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ==================== SHOPEE-WEB: COVERAGE (main only) ====================
  coverage-web:
    name: Coverage (shopee-web)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [changes, test-web]
    if: github.ref == 'refs/heads/master' && (needs.changes.outputs.web-src == 'true' || needs.changes.outputs.web-tests == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run Tests with Coverage
        run: pnpm nx run shopee-web:test -- --run --coverage
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/shopee-web/coverage/lcov.info
          flags: shopee-web
          fail_ci_if_error: false

  # ==================== SHOPEE-WEB: BUILD ====================
  build-web:
    name: Build (shopee-web)
    runs-on: ubuntu-latest
    needs: [lint-web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shopee-web
        run: cd apps/shopee-web && pnpm run build:production
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shopee-web-build
          path: apps/shopee-web/dist/
          retention-days: 3

  # ==================== SHOPEE-WEB: DEPLOY PRODUCTION ====================
  deploy-web:
    name: Deploy Production (shopee-web)
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: shopee-web-build
          path: apps/shopee-web/dist

      - name: Create Vercel Output & Deploy
        run: |
          mkdir -p .vercel/output/static
          cp -r apps/shopee-web/dist/* .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/" }
            ]
          }
          EOF
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ==================== SHOPEE-ADMIN: LINT ====================
  lint-admin:
    name: Lint (shopee-admin)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin-src == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeScript Type Check
        run: cd apps/shopee-admin && npx tsc --noEmit
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: ESLint
        run: pnpm nx run shopee-admin:lint

  # ==================== SHOPEE-ADMIN: TEST ====================
  test-admin:
    name: Test (shopee-admin)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin-src == 'true' || needs.changes.outputs.admin-tests == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm nx run shopee-admin:test -- --run --coverage
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/shopee-admin/coverage/lcov.info
          flags: shopee-admin
          fail_ci_if_error: false

  # ==================== SHOPEE-ADMIN: BUILD ====================
  build-admin:
    name: Build (shopee-admin)
    runs-on: ubuntu-latest
    needs: [lint-admin]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shopee-admin
        run: cd apps/shopee-admin && pnpm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shopee-admin-build
          path: apps/shopee-admin/dist/
          retention-days: 3

  # ==================== SHOPEE-ADMIN: DEPLOY PRODUCTION ====================
  deploy-admin:
    name: Deploy Production (shopee-admin)
    runs-on: ubuntu-latest
    needs: [build-admin]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: shopee-admin-build
          path: apps/shopee-admin/dist

      - name: Create Vercel Output & Deploy
        run: |
          mkdir -p .vercel/output/static
          cp -r apps/shopee-admin/dist/* .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/" }
            ]
          }
          EOF
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ==================== SHOPEE-API: LINT ====================
  lint-api:
    name: Lint (shopee-api)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api-src == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: TypeScript Type Check
        run: cd apps/shopee-api && npx tsc --noEmit
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ==================== SHOPEE-API: TEST ====================
  test-api:
    name: Test (shopee-api)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api-src == 'true' || needs.changes.outputs.api-tests == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: cd apps/shopee-api && pnpm test -- --coverage --forceExit
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/shopee-api/coverage/lcov.info
          flags: shopee-api
          fail_ci_if_error: false

  # ==================== SHOPEE-API: BUILD ====================
  build-api:
    name: Build (shopee-api)
    runs-on: ubuntu-latest
    needs: [lint-api]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shopee-api
        run: cd apps/shopee-api && pnpm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shopee-api-build
          path: apps/shopee-api/build/
          retention-days: 3
