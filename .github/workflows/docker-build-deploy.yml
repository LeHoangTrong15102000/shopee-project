name: Docker Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images regardless of changes'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==================== DETECT CHANGES ====================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.resolve.outputs.api }}
      web: ${{ steps.resolve.outputs.web }}
      admin: ${{ steps.resolve.outputs.admin }}
    steps:
      - uses: actions/checkout@v4

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/shopee-api/**'
              - 'pnpm-lock.yaml'
              - 'apps/shopee-api/Dockerfile'
            web:
              - 'apps/shopee-web/**'
              - 'libs/**'
              - 'pnpm-lock.yaml'
              - 'apps/shopee-web/Dockerfile'
            admin:
              - 'apps/shopee-admin/**'
              - 'libs/**'
              - 'pnpm-lock.yaml'
              - 'apps/shopee-admin/Dockerfile'
            infra:
              - 'docker/**'
              - 'docker-compose.prod.yaml'
              - '.dockerignore'

      - name: Resolve final flags (force_rebuild or infra overrides)
        id: resolve
        shell: bash
        run: |
          FORCE="${{ inputs.force_rebuild }}"
          INFRA="${{ steps.filter.outputs.infra }}"

          if [ "$FORCE" = "true" ] || [ "$INFRA" = "true" ]; then
            echo "api=true"   >> $GITHUB_OUTPUT
            echo "web=true"   >> $GITHUB_OUTPUT
            echo "admin=true" >> $GITHUB_OUTPUT
          else
            echo "api=${{ steps.filter.outputs.api }}"     >> $GITHUB_OUTPUT
            echo "web=${{ steps.filter.outputs.web }}"     >> $GITHUB_OUTPUT
            echo "admin=${{ steps.filter.outputs.admin }}" >> $GITHUB_OUTPUT
          fi

  # ==================== BUILD & PUSH: API ====================
  build-push-api:
    name: Build & Push (shopee-api)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    outputs:
      image-ref: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shopee-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest

      - name: Compute short SHA
        id: sha
        shell: bash
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/shopee-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=shopee-api
          cache-to: type=gha,mode=max,scope=shopee-api

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/shopee-api:sha-${{ steps.sha.outputs.short }}
          format: sarif
          output: trivy-api.sarif
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: shopee-api
        continue-on-error: true

  # ==================== BUILD & PUSH: WEB ====================
  build-push-web:
    name: Build & Push (shopee-web)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shopee-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest

      - name: Compute short SHA
        id: sha
        shell: bash
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/shopee-web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=shopee-web
          cache-to: type=gha,mode=max,scope=shopee-web
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL_PROD }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL_PROD }}
            VITE_SITE_URL=${{ vars.VITE_SITE_URL_PROD }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.VITE_STRIPE_PUBLISHABLE_KEY_PROD }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/shopee-web:sha-${{ steps.sha.outputs.short }}
          format: sarif
          output: trivy-web.sarif
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-web.sarif
          category: shopee-web
        continue-on-error: true

  # ==================== BUILD & PUSH: ADMIN ====================
  build-push-admin:
    name: Build & Push (shopee-admin)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shopee-admin
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest

      - name: Compute short SHA
        id: sha
        shell: bash
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/shopee-admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=shopee-admin
          cache-to: type=gha,mode=max,scope=shopee-admin
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL_PROD }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL_PROD }}
            VITE_APP_VERSION=${{ vars.VITE_APP_VERSION_PROD }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/shopee-admin:sha-${{ steps.sha.outputs.short }}
          format: sarif
          output: trivy-admin.sarif
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-admin.sarif
          category: shopee-admin
        continue-on-error: true

  # ==================== DEPLOY TO VPS ====================
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-push-api, build-push-web, build-push-admin]
    if: always()
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            REGISTRY="ghcr.io/${{ github.repository_owner }}"
            IMAGE_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"

            # Build list of changed services based on detect-changes outputs
            SERVICES=""
            if [ "${{ needs.build-push-api.result }}" = "success" ]; then
              SERVICES="$SERVICES shopee-api"
            fi
            if [ "${{ needs.build-push-web.result }}" = "success" ]; then
              SERVICES="$SERVICES shopee-web"
            fi
            if [ "${{ needs.build-push-admin.result }}" = "success" ]; then
              SERVICES="$SERVICES shopee-admin"
            fi

            SERVICES="$(echo $SERVICES | xargs)"

            if [ -z "$SERVICES" ]; then
              echo "No services were rebuilt — nothing to deploy."
              exit 0
            fi

            echo "Deploying services: $SERVICES"
            /opt/shopee/scripts/deploy.sh "$REGISTRY" "$IMAGE_TAG" "$SERVICES"

  # ==================== POST-DEPLOY HEALTH CHECK ====================
  post-deploy-health:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy-vps
    environment: production
    steps:
      - name: Health check via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: /opt/shopee/scripts/health-check.sh
